services:
  mawan:
    build: .
    image: mawan:local
    ports:
      - "8788:8788"
    environment:
      MAWAN_MCP_API_KEY: ${MAWAN_MCP_API_KEY:-}
    restart: unless-stopped

  stdio:
    profiles: ["stdio"]
    build: .
    image: mawan:local
    stdin_open: true
    entrypoint: ["mawan"]
    command: ["mcp"]
